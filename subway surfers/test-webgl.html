<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebGL Test</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: monospace; padding: 20px; }
    canvas { border: 2px solid #0f0; display: block; margin: 20px 0; }
    .pass { color: #0f0; }
    .fail { color: #f44; }
    .warn { color: #fa0; }
  </style>
</head>
<body>
  <h1>WebGL Capability Test</h1>
  <div id="results"></div>
  <canvas id="test-canvas" width="300" height="300"></canvas>

  <script type="module">
    const results = document.getElementById('results');
    const canvas = document.getElementById('test-canvas');
    let html = '';

    function add(msg, cls = '') {
      html += `<p class="${cls}">${msg}</p>`;
    }

    // Test 1: Canvas element exists
    if (canvas) {
      add('✅ Canvas element found in DOM', 'pass');
      add(`   Size: ${canvas.width}x${canvas.height}`, '');
    } else {
      add('❌ Canvas element NOT found', 'fail');
    }

    // Test 2: WebGL context
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      add('✅ WebGL context acquired!', 'pass');
      const dbg = gl instanceof WebGLRenderingContext ? 'WebGL1' : 'WebGL';
      add(`   Context: ${dbg}`, '');

      // Report renderer info
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      if (ext) {
        add(`   GPU: ${gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)}`, 'pass');
        add(`   Vendor: ${gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)}`, '');
      } else {
        add(`   Renderer: ${gl.getParameter(gl.RENDERER)?.substring(0, 60) || '(unknown)'}`, '');
        add(`   Vendor: ${gl.getParameter(gl.VENDOR)?.substring(0, 60) || '(unknown)'}`, '');
      }

      // Test 3: Can we actually draw?
      gl.clearColor(0.2, 0.5, 0.8, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      add('✅ Successfully cleared canvas to blue', 'pass');
    } else {
      const gl2 = canvas.getContext('webgl2');
      if (gl2) {
        add('⚠️ Only WebGL2 available (not WebGL1)', 'warn');
      } else {
        add('❌ NO WebGL context! This is why the game screen is black.', 'fail');
        html += '<p class="fail">Your browser does not support WebGL, or it has been disabled.</p>';
        html += '<p>Try: Chrome, Firefox, Safari. Enable WebGL in browser settings if needed.</p>';
      }
    }

    // Test 4: Check for Three.js compatibility
    add('', '');
    add('=== Checking Game Environment ===', '');

    // Test 5: Check document ready state
    add(`   Document readyState: ${document.readyState}`, '');

    // Test 6: Check window dimensions
    add(`   Window size: ${window.innerWidth}x${window.innerHeight}`, '');
    if (window.innerWidth === 0 || window.innerHeight === 0) {
      add('⚠️ Window has zero dimensions! Canvas will be 0x0', 'warn');
    }

    // Test 7: Check for touch support
    add(`   Touch support: ${'ontouchstart' in window ? 'Yes' : 'No'}`, '');

    results.innerHTML = html;
  </script>
</body>
</html>
